# Publishes to npm when a version tag is pushed.
#
# Release flow: `vp exec bumpp` locally (bumps package.json, commits, tags
# v<version>, pushes) — this workflow validates and publishes that tag.
# Requires the NPM_TOKEN repository secret (granular npm token with publish
# access to effect-domain).
name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm --provenance
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
      - run: vp install
      - run: vp check
      - run: vp test
      - run: |
          echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
