# Publishes to npm when a version tag is pushed.
#
# Release flow: `vp exec bumpp` locally (bumps package.json, commits, tags
# v<version>, pushes) — this workflow validates and publishes that tag.
# Auth is npm trusted publishing (OIDC): the effect-domain package on npm
# trusts this repo + workflow file, so no token or secret is involved.
name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm --provenance
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
      - run: vp install
      - run: vp check
      - run: vp test
      - run: npm publish
